<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ExtentDesktop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    transition: none;
  }
  #wrap.rotate {
    transform: translate(-50%, -50%) rotate(90deg);
  }
  canvas {
    display: block;
    background: #000;
  }
  #status {
    position: fixed;
    top: env(safe-area-inset-top, 0);
    left: 0;
    right: 0;
    color: #8f8;
    font: 14px -apple-system, monospace;
    text-align: center;
    padding: 6px;
    background: rgba(0,0,0,0.6);
    z-index: 10;
    pointer-events: none;
  }
  #status.hidden { opacity: 0; transition: opacity 1s; }
  #fps {
    position: fixed;
    top: env(safe-area-inset-top, 8px);
    right: 8px;
    color: #8f8;
    font: bold 12px -apple-system, monospace;
    background: rgba(0,0,0,0.5);
    padding: 4px 8px;
    border-radius: 4px;
    z-index: 10;
    pointer-events: none;
    text-align: right;
    line-height: 1.4;
    white-space: pre-line;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas"></canvas></div>
<div id="status">Connecting...</div>
<div id="fps">-- fps</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const wrap = document.getElementById('wrap');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  ctx.imageSmoothingEnabled = false;
  const statusEl = document.getElementById('status');
  const fpsEl = document.getElementById('fps');

  function updateLayout() {
    const ww = window.innerWidth;
    const wh = window.innerHeight;
    const cw = canvas.width || 1920;
    const ch = canvas.height || 1080;
    const winLandscape = ww >= wh;
    const imgLandscape = cw >= ch;

    if (winLandscape === imgLandscape) {
      wrap.classList.remove('rotate');
      const scale = Math.min(ww / cw, wh / ch);
      canvas.style.width = (cw * scale) + 'px';
      canvas.style.height = (ch * scale) + 'px';
    } else {
      wrap.classList.add('rotate');
      const scale = Math.min(wh / cw, ww / ch);
      canvas.style.width = (cw * scale) + 'px';
      canvas.style.height = (ch * scale) + 'px';
    }
  }

  window.addEventListener('resize', updateLayout);
  window.addEventListener('orientationchange', updateLayout);
  if (document.addEventListener) {
    document.addEventListener('fullscreenchange', updateLayout);
    document.addEventListener('webkitfullscreenchange', updateLayout);
  }
  updateLayout();

  function toggleFullscreen() {
    const doc = document;
    const inFs = doc.fullscreenElement || doc.webkitFullscreenElement;
    if (inFs) {
      try {
        if (doc.exitFullscreen) doc.exitFullscreen();
        else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
      } catch (e) {}
      return;
    }

    const targets = [
      [doc.documentElement, 'requestFullscreen'],
      [doc.documentElement, 'webkitRequestFullscreen'],
      [doc.body, 'requestFullscreen'],
      [doc.body, 'webkitRequestFullscreen'],
      [canvas, 'requestFullscreen'],
      [canvas, 'webkitRequestFullscreen'],
      [canvas, 'webkitEnterFullscreen'],
    ];

    for (let i = 0; i < targets.length; i++) {
      const t = targets[i][0];
      const m = targets[i][1];
      if (t && typeof t[m] === 'function') {
        try {
          const r = t[m]();
          if (r && r.catch) r.catch(err => setStatus('FS rejected: ' + (err.message || err), true));
          setStatus('Fullscreen via ' + (t === doc.documentElement ? 'html' : t === doc.body ? 'body' : 'canvas') + '.' + m, true);
          return;
        } catch (e) {
          setStatus('FS attempt failed: ' + e.message, true);
        }
      }
    }
    setStatus('No fullscreen API on this browser. Use Safari → Share → Add to Home Screen for true fullscreen.', true);
  }

  canvas.addEventListener('click', toggleFullscreen);
  document.body.addEventListener('click', (e) => {
    if (e.target === document.body || e.target.id === 'wrap') toggleFullscreen();
  });

  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {
      console.warn('wakeLock failed', e);
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });
  document.addEventListener('click', requestWakeLock, { once: true });

  let decoder = null;
  let configured = false;
  let waitForKeyframe = true;
  let frameCount = 0;
  let recvCount = 0;
  let decodeCount = 0;
  let lastFpsTime = performance.now();
  let videoStartedAt = 0;
  let rafCount = 0;
  let pendingFrames = [];
  let chunkTimestamp = 0;
  let queueMax = 0;
  let activeWs = null;
  let reconnectTimer = null;
  let lowStreamSeconds = 0;
  const maxPendingFrames = 2;
  const params = new URLSearchParams(location.search);
  const fixedMaxRaw = params.get('max');
  const adaptiveScale = fixedMaxRaw === null && params.get('auto') === '1';
  const adaptiveMaxSteps = [1024, 864, 720, 640];
  let adaptiveStep = 0;
  let currentMaxDimension = getInitialWebMaxDimension();

  function renderLoop() {
    rafCount++;
    const f = pendingFrames.shift();
    if (f) {
      try {
        ctx.drawImage(f, 0, 0, canvas.width, canvas.height);
        frameCount++;
      } catch (e) {
        console.error('drawImage', e);
      } finally {
        f.close();
      }
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  setInterval(() => {
    const now = performance.now();
    const elapsed = Math.max(0.001, (now - lastFpsTime) / 1000);
    lastFpsTime = now;
    const fps = (value) => Math.round(value / elapsed);
    const recvFps = fps(recvCount);
    const decFps = fps(decodeCount);
    const drawFps = fps(frameCount);
    const rafFps = fps(rafCount);
    const maxText = currentMaxDimension > 0 ? currentMaxDimension : 'host';
    fpsEl.textContent = 'recv ' + recvFps + '\ndec  ' + decFps + '\ndraw ' + drawFps + '\nraf  ' + rafFps + '\nmax  ' + maxText + '\nqmax ' + queueMax;
    updateAdaptiveScale(recvFps, decFps, drawFps, rafFps, queueMax);
    recvCount = 0;
    decodeCount = 0;
    frameCount = 0;
    rafCount = 0;
    queueMax = 0;
  }, 1000);

  function setStatus(text, persist) {
    statusEl.textContent = text;
    statusEl.classList.remove('hidden');
    if (!persist) {
      setTimeout(() => statusEl.classList.add('hidden'), 1500);
    }
  }

  function isKeyframe(data) {
    let i = 0;
    while (i < data.length - 4) {
      if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1) {
        const t = data[i + 3] & 0x1F;
        if (t === 5) return true;
        if (t === 1) return false;
        i += 3;
      } else if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 0 && data[i + 3] === 1) {
        const t = data[i + 4] & 0x1F;
        if (t === 5) return true;
        if (t === 1) return false;
        i += 4;
      } else {
        i++;
      }
    }
    return false;
  }

  function initDecoder(width, height) {
    canvas.width = width;
    canvas.height = height;
    ctx.imageSmoothingEnabled = false;
    chunkTimestamp = 0;
    updateLayout();

    decoder = new VideoDecoder({
      output: (frame) => {
        decodeCount++;
        pendingFrames.push(frame);
        while (pendingFrames.length > maxPendingFrames) {
          const stale = pendingFrames.shift();
          try { stale.close(); } catch (e) {}
        }
      },
      error: (err) => {
        console.error('Decoder error:', err);
        setStatus('Decoder error: ' + err.message, true);
        configured = false;
        waitForKeyframe = true;
      }
    });

    decoder.configure({
      codec: 'avc1.640032',
      optimizeForLatency: true
    });
    configured = true;
    waitForKeyframe = true;
    videoStartedAt = 0;
    setStatus('Decoder ready ' + width + 'x' + height);
  }

  function connect() {
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const maxDim = currentMaxDimension;
    const wsUrl = proto + '//' + location.host + '/stream' + (maxDim > 0 ? '?max=' + maxDim : '');
    setStatus('Connecting to ' + wsUrl, true);

    const ws = new WebSocket(wsUrl);
    activeWs = ws;
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      setStatus('Connected, waiting for video...', true);
    };

    ws.onmessage = (e) => {
      if (typeof e.data === 'string') {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'config') {
            initDecoder(msg.width, msg.height);
          }
        } catch (err) {
          console.warn('bad text message', e.data);
        }
        return;
      }

      if (!configured || !decoder) return;

      recvCount++;
      if (typeof decoder.decodeQueueSize === 'number') {
        queueMax = Math.max(queueMax, decoder.decodeQueueSize);
      }
      const data = new Uint8Array(e.data);
      const isKey = isKeyframe(data);

      if (waitForKeyframe) {
        if (!isKey) return;
        waitForKeyframe = false;
        videoStartedAt = performance.now();
        statusEl.classList.add('hidden');
      }

      try {
        chunkTimestamp += 16667;
        const chunk = new EncodedVideoChunk({
          type: isKey ? 'key' : 'delta',
          timestamp: chunkTimestamp,
          data: data
        });
        decoder.decode(chunk);
      } catch (err) {
        console.error('decode error', err);
        waitForKeyframe = true;
      }
    };

    ws.onerror = (err) => {
      console.error('WebSocket error', err);
    };

    ws.onclose = () => {
      if (activeWs !== ws) {
        return;
      }
      activeWs = null;
      setStatus('Disconnected. Reconnecting in 2s...', true);
      resetDecoder();
      reconnectTimer = setTimeout(connect, 2000);
    };
  }

  function getInitialWebMaxDimension() {
    if (fixedMaxRaw === null) return adaptiveMaxSteps[0];
    const value = Number(fixedMaxRaw);
    if (!Number.isFinite(value)) return adaptiveMaxSteps[0];
    return Math.max(0, Math.min(3840, Math.round(value)));
  }

  function updateAdaptiveScale(recvFps, decFps, drawFps, rafFps, qmax) {
    if (!adaptiveScale || !configured || waitForKeyframe || videoStartedAt === 0) return;
    if (performance.now() - videoStartedAt < 5000) return;

    if (rafFps < 54) {
      lowStreamSeconds = 0;
      return;
    }

    const streamFps = Math.min(recvFps, decFps, drawFps);
    if (streamFps < 54 || qmax > 3) {
      lowStreamSeconds++;
    } else {
      lowStreamSeconds = 0;
    }

    if (lowStreamSeconds >= 2 && adaptiveStep < adaptiveMaxSteps.length - 1) {
      adaptiveStep++;
      currentMaxDimension = adaptiveMaxSteps[adaptiveStep];
      lowStreamSeconds = 0;
      reconnectNow('Auto stream max ' + currentMaxDimension);
    }
  }

  function reconnectNow(message) {
    setStatus(message, true);
    const ws = activeWs;
    activeWs = null;
    if (ws) {
      ws.onclose = null;
      try { ws.close(); } catch (e) {}
    }
    resetDecoder();
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
    }
    reconnectTimer = setTimeout(connect, 250);
  }

  function resetDecoder() {
    configured = false;
    waitForKeyframe = true;
    videoStartedAt = 0;
    closePendingFrames();
    if (decoder) {
      try { decoder.close(); } catch (e) {}
      decoder = null;
    }
  }

  function closePendingFrames() {
    while (pendingFrames.length > 0) {
      const f = pendingFrames.shift();
      try { f.close(); } catch (e) {}
    }
  }

  if (typeof VideoDecoder === 'undefined') {
    setStatus('WebCodecs not supported. Need iOS 17.4+ Safari.', true);
    return;
  }

  connect();
})();
</script>
</body>
</html>
